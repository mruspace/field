# Mru Field: the demo task under the supervisor, on the bench.
# Run from the repository root after `cargo build --release`:
#   target/release/field run tasks/demo/field.conf
# Every key has a default (docs/spec.md, section 9); these are the ones a
# bench run changes. Paths are relative to the working directory.

task        = "target/release/field-demo-task"   # the replica executable
input       = "tick"            # the cycle number is the input record
period_ms   = 1000              # one cycle per second
output      = "file:out/delivered"   # cycle, length, bytes, per delivered output
dir         = "out"             # events.csv, summary.txt, checkpoint
kat_input   = "tasks/demo/kat.in"
kat_output  = "tasks/demo/kat.out"
checkpoint_every = 100
summary_every    = 1000
cpu_percent = 5                 # the supervisor's share of one core
